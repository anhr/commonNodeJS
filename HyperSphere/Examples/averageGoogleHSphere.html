<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>4D Hypersphere - 5000 Points</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #controls {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
        }

        button {
            cursor: pointer;
            padding: 8px 12px;
            margin: 5px 0;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        #toggleBtn {
            background: #4CAF50;
            color: white;
        }

            #toggleBtn.stop {
                background: #f44336;
            }

        #stepBtn.stop {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div id="controls">
        <span>4D Гиперсфера (<span id="pointCount">---</span> точек)</span><br>
        <span>Итерация: <span id="iteration">---</span></span><br>
        <small>Используйте мышь для вращения</small>
        <button id="toggleBtn" onclick="toggleSimulation()">СТАРТ</button>
        <button id="stepBtn" onclick="simulationStep()">ШАГ</button>
        <button onclick="resetPoints(false)">Случайные</button>
        <button onclick="resetPoints(true)">В одну точку</button>
    </div>

    <!-- Подключение Three.js и OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"

    <script type="module">
        /*
                import * as THREE from 'three';
                import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        */
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const angles = [
            //[0, 0, 0],//0
            //[Math.PI / 1, Math.PI / 19, Math.PI / 10],//0. Эта вершина лежит на оси W потомучто Altitude = Math.PI. Это приводит к тому что в функции cartesianToPolar величина rXYZ < 1e-10 и широта с долготой не определены (принимаем за 0)
            [Math.PI / 1.5, Math.PI / 19, Math.PI / 10],//0.
            [Math.PI / 2, Math.PI / 20, Math.PI / 11],//1
            [Math.PI / 3, Math.PI / 21, Math.PI / 2],//2
            [Math.PI / 4, Math.PI / 22, -Math.PI / 2],//3
            [Math.PI / 5, Math.PI / 23, Math.PI],//4
        ];

        //true - исходные точки вычисляются случайно
        //false - исходные точки заданы в массиве angles
        const isRandom = true;

        const k = 10;//250;
        const NUM_POINTS = isRandom ? 500 * k : angles.length;
        document.getElementById('pointCount').innerHTML = NUM_POINTS;
        const RADIUS = 1.0;
        const STEP_SIZE = isRandom ? 0.02 / k : 0.002; // Скорость движения
        let points4D = [];
        let instancedMesh;
        let isRunning = false;
        let isStep = false;
        let iteration = 0;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 0, 4);
        controls.update();

        // Освещение
        const light = new THREE.PointLight(0xffffff, 20);
        light.position.set(5, 5, 5);
        scene.add(light, new THREE.AmbientLight(0x444444));

        class Vector4 {
            constructor(x, y, z, w) { this.x = x; this.y = y; this.z = z; this.w = w; }
            static fromPolar(lat, lon, alt) {
                const sA = Math.sin(alt), cA = Math.cos(alt);
                const sLat = Math.sin(lat), cLat = Math.cos(lat);
                const sLon = Math.sin(lon), cLon = Math.cos(lon);
                return new Vector4(
                    cLat * cLon * sA * RADIUS,
                    sLat * sA * RADIUS,
                    cLat * sLon * sA * RADIUS,
                    cA * RADIUS
                );
                //                return new Vector4(cLat * cLon * sA, sLat * sA, cLat * sLon * sA, cA);
            }
            normalize() {
                let d = Math.sqrt(this.x ** 2 + this.y ** 2 + this.z ** 2 + this.w ** 2);
                this.x = (this.x / d) * RADIUS;
                this.y = (this.y / d) * RADIUS;
                this.z = (this.z / d) * RADIUS;
                this.w = (this.w / d) * RADIUS;
                //                this.x /= d; this.y /= d; this.z /= d; this.w /= d;
                return this;
            }
            projectTo3D() {
                const factor = 1 / (1.3 - this.w);
                return new THREE.Vector3(this.x * factor, this.y * factor, this.z * factor);
            }
        }

        window.toggleSimulation = function () {
            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = isRunning ? 'СТОП' : 'СТАРТ';
            btn.className = isRunning ? 'stop' : '';
        };

        window.simulationStep = function () {
            isRunning = true;
            isStep = true;
            const btn = document.getElementById('stepBtn');
            btn.className = 'stop';
        };

        // Преобразование 4D декартовых координат в 4D полярные
        function cartesianToPolar4D(x, y, z, w) {
            const r = Math.sqrt(x * x + y * y + z * z + w * w);

            // altitude (угол от оси W)
            const altitude = Math.acos(w / r);

            // Проекция на 3D гиперплоскость XYZ
            const r3d = Math.sqrt(x * x + y * y + z * z);

            let latitude, longitude;

            if (r3d < 0.0001) {
                // Точка на оси W
                latitude = 0;
                longitude = 0;
            } else {
                // latitude (широта, угол от плоскости XY)
                latitude = Math.asin(z / r3d);

                // longitude (долгота, угол в плоскости XY)
                longitude = Math.atan2(y, x);
            }

            return {
                latitude: latitude,
                longitude: longitude,
                altitude: altitude
            };
        }

        // --- Генерация случайной точки на 4D гиперсфере ---
        function generateRandomPoint() {
            // Равномерное распределение на 3-сфере (гиперсфере)

            // Метод: генерируем 4 нормально распределенных числа и нормализуем
            // Это дает равномерное распределение на сфере

            let x, y, z, w;
            let r2;

            do {
                x = Math.random() * 2 - 1;
                y = Math.random() * 2 - 1;
                z = Math.random() * 2 - 1;
                w = Math.random() * 2 - 1;
                r2 = x * x + y * y + z * z + w * w;
            } while (r2 > 1 || r2 < 0.01); // Отбрасываем точки вне сферы и слишком близко к центру

            const r = Math.sqrt(r2);
            x /= r;
            y /= r;
            z /= r;
            w /= r;

            // Преобразуем в полярные координаты
            return cartesianToPolar4D(
                x * RADIUS,
                y * RADIUS,
                z * RADIUS,
                w * RADIUS
            );
        }

        window.resetPoints = function (allInOne) {
            iteration = 0;
            document.getElementById('iteration').innerHTML = iteration;

            if (instancedMesh) scene.remove(instancedMesh);

            points4D = [];
            const geometry = new THREE.SphereGeometry(0.008, 8, 8); // Диаметр уменьшен
            const material = new THREE.MeshPhongMaterial();
            instancedMesh = new THREE.InstancedMesh(geometry, material, NUM_POINTS);

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();

            for (let i = 0; i < NUM_POINTS; i++) {
                const p = allInOne ?
                    //                    { latitude: 0.001 * i, longitude: 0, altitude: 0.001 } :
                    { latitude: 0, longitude: 0, altitude: 0 } :
                    generateRandomPoint();
                /*
                                    {
                                        longitude: isRandom ? (Math.random() - 0.5) * 2 * Math.PI : angles[i][2],
                                        latitude: isRandom ? (Math.random() - 0.5) * Math.PI : angles[i][1],
                                        altitude: isRandom ? Math.random() * Math.PI : angles[i][0]
                                    };
                */
                points4D.push(p);

                const v = Vector4.fromPolar(p.latitude, p.longitude, p.altitude);
                dummy.position.copy(v.projectTo3D());
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);

                color.setHSL(0.5 + v.w * 0.4, 0.8, 0.5);
                instancedMesh.setColorAt(i, color);
            }
            scene.add(instancedMesh);
        };

        function updatePhysics() {
            if (!isRunning) return;
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            const vecs = points4D.map(p => Vector4.fromPolar(p.latitude, p.longitude, p.altitude));

            // Массив для хранения сил
            const forces = vecs.map(() => ({ x: 0, y: 0, z: 0, w: 0 }));

            // Вычисляем силы от всех пар точек (симметрично)
            for (let i = 0; i < vecs.length; i++) {
                for (let j = i + 1; j < vecs.length; j++) {
                    const dx = vecs[i].x - vecs[j].x;
                    const dy = vecs[i].y - vecs[j].y;
                    const dz = vecs[i].z - vecs[j].z;
                    const dw = vecs[i].w - vecs[j].w;

                    const d2 = dx * dx + dy * dy + dz * dz + dw * dw;// + 0.0001;
                    const d = Math.sqrt(d2);

                    // Сила отталкивания: 1/d^3 (для 4D сферы)
                    const forceMag = STEP_SIZE / (d2 * d);
                    if (forceMag === Infinity) {
                        console.error('сила отталкивания бесконечна');
                        break;
                    }

                    // Применяем силу к обоим точкам (симметрично)
                    forces[i].x += dx * forceMag;
                    forces[i].y += dy * forceMag;
                    forces[i].z += dz * forceMag;
                    forces[i].w += dw * forceMag;

                    forces[j].x -= dx * forceMag;
                    forces[j].y -= dy * forceMag;
                    forces[j].z -= dz * forceMag;
                    forces[j].w -= dw * forceMag;
                }
            }

            // Обновляем позиции
            for (let i = 0; i < vecs.length; i++) {
                let fx = forces[i].x;
                let fy = forces[i].y;
                let fz = forces[i].z;
                let fw = forces[i].w;

                // Ограничиваем силу, чтобы избежать "взрыва" системы
                const maxForce = 0.05;
                const fMag = Math.sqrt(fx * fx + fy * fy + fz * fz + fw * fw);
                if (fMag > maxForce) {
                    fx = (fx / fMag) * maxForce;
                    fy = (fy / fMag) * maxForce;
                    fz = (fz / fMag) * maxForce;
                    fw = (fw / fMag) * maxForce;
                }

                let v = new Vector4(vecs[i].x + fx, vecs[i].y + fy, vecs[i].z + fz, vecs[i].w + fw).normalize();

                // Конвертируем обратно в углы
                const alt = Math.acos(Math.max(-1, Math.min(1, v.w)));
                const sA = Math.sin(alt);
                points4D[i] = {
                    altitude: alt,
                    latitude: sA < 0.001 ? 0 : Math.asin(Math.max(-1, Math.min(1, v.y / sA))),
                    longitude: sA < 0.001 ? 0 : Math.atan2(v.z, v.x)
                };

                dummy.position.copy(v.projectTo3D());
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);

                color.setHSL(0.5 + v.w * 0.4, 0.8, 0.5);
                instancedMesh.setColorAt(i, color);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

            iteration++;
            document.getElementById('iteration').innerHTML = iteration;

            if (isStep) {
                isStep = false;
                isRunning = false;

                const btn = document.getElementById('stepBtn');
                btn.className = '';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        resetPoints(false);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
