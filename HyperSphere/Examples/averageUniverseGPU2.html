<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>averageUniverse - Debug Sync Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        button, select {
            padding: 10px 15px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

            button:hover {
                background: #333;
            }

            button:disabled {
                opacity: 0.5;
                cursor: wait;
            }

        #info {
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
        }

        .timer {
            color: #00ffcc;
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }

        #activeGpu {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
            display: block;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="controls">
            <select id="gpuSelect">
                <option value="-1">Поиск видеокарт...</option>
            </select>
            <button id="stepBtn">Шаг (CPU)</button>
            <button id="startBtn">Старт (CPU)</button>
            <button id="gpuBtn">Старт (GPU)</button>
        </div>
        <div id="info">
            Шаг: <span id="stepCounter">1</span> / <span id="totalStepsDisplay">100</span> | R: <span id="radVal">0.10</span>
            <span id="timeResult" class="timer"></span>
            <span id="activeGpu"></span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- КОНФИГУРАЦИЯ ---
        const DEBUG_MODE = true;
        const RANDOM_POINTS = !DEBUG_MODE;
        const totalSteps = RANDOM_POINTS ? 100 : 10;
        const pointsPerStep = RANDOM_POINTS ? 500 : 5;
        const count = totalSteps * pointsPerStep;

        const baseRadius = 0.1;
        const radiusMax = 2;
        const radiusStep = (radiusMax - baseRadius) / (totalSteps - 1);
        const DAMPING = 0.95;
        const REPULSION_STRENGTH = 50 / pointsPerStep;

        let currentStep = 1;
        let radiusPrev = baseRadius;
        let velocities = Array.from({ length: pointsPerStep }, () => ({ x: 0, y: 0, z: 0, w: 0 }));
        const angles = new Array(count).fill(null).map(() => ({ latitude: 0, longitude: 0, altitude: 0 }));

        document.getElementById('totalStepsDisplay').innerText = totalSteps;

        // --- THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(3, 3, 3);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const posAttr = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
        const colorAttr = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
        geometry.setAttribute('position', posAttr);
        geometry.setAttribute('color', colorAttr);
        scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.015, vertexColors: true })));

        // --- WebGPU SHADER ---
        const shaderCode = `
                struct Params { damping: f32, repulsionStrength: f32, radius: f32, stepOffset: f32, pointsPerStep: f32 };
                struct PolarAngles { latitude: f32, longitude: f32, altitude: f32, _pad: f32 };

                @group(0) @binding(0) var<storage, read_write> positions: array<vec4<f32>>;
                @group(0) @binding(1) var<storage, read_write> velocities: array<vec4<f32>>;
                @group(0) @binding(2) var<uniform> p: Params;
                @group(0) @binding(3) var<storage, read_write> debugForce: vec4<f32>;
                @group(0) @binding(4) var<storage, read_write> anglesBuf: array<PolarAngles>;

                fn gpuCartesianToPolar(v: vec4<f32>) -> PolarAngles {
                    let R = sqrt(dot(v, v)) + 1e-10;
                    let alt = acos(clamp(v.w / R, -1.0, 1.0));
                    let rXYZ = sqrt(v.x*v.x + v.y*v.y + v.z*v.z) + 1e-10;
                    let lat = asin(clamp(v.z / rXYZ, -1.0, 1.0));
                    let lon = atan2(v.y, v.x);
                    return PolarAngles(lat, lon, alt, 0.0);
                }

                @compute @workgroup_size(64)
                fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                    let i = id.x;
                    if (i >= u32(p.pointsPerStep)) { return; }

                    let prevOffset = u32(p.stepOffset - p.pointsPerStep);
                    let currOffset = u32(p.stepOffset);
                    let p1 = positions[prevOffset + i];
                    let p1_n = normalize(p1);

                    var force = vec4<f32>(0.0);
                    for (var j = 0u; j < u32(p.pointsPerStep); j++) {
                        if (i == j) { continue; }
                        let p2_n = normalize(positions[prevOffset + j]);
                        let diff = p1_n - p2_n;
                        let d2 = dot(diff, diff) + 1e-6;
                        force += normalize(diff) * (p.repulsionStrength / d2);
                    }

                    if (i == 0u) { debugForce = force; }

                    let v_new = velocities[i] * p.damping + force;
                    velocities[i] = v_new;
                    let next_pos_unit = normalize(p1_n + v_new);
                    positions[currOffset + i] = next_pos_unit * p.radius;
                    anglesBuf[currOffset + i] = gpuCartesianToPolar(next_pos_unit);
                }
            `;

        const polarToCartesian = (la, lo, al, r) => {
            const r_xyz = r * Math.sin(al), w = r * Math.cos(al);
            return { x: r_xyz * Math.cos(la) * Math.cos(lo), y: r_xyz * Math.cos(la) * Math.sin(lo), z: r_xyz * Math.sin(la), w };
        };
        const cartesianToPolar = (v) => {
            const R = Math.sqrt(v.x ** 2 + v.y ** 2 + v.z ** 2 + v.w ** 2) || 1e-10, al = Math.acos(Math.min(1, Math.max(-1, v.w / R)));
            const rXYZ = Math.sqrt(v.x ** 2 + v.y ** 2 + v.z ** 2) || 1e-10;
            return { altitude: al, latitude: Math.asin(Math.min(1, Math.max(-1, v.z / rXYZ))), longitude: Math.atan2(v.y, v.x) };
        };

        // --- WebGPU: ПОИСК АДАПТЕРОВ ---
        let device, pipeline, posBuf, velBuf, paramBuf, debugBuf, anglesBufGPU, bindGroup;
        let availableAdapters = [];

        async function getSafeAdapterName(adapter, index) {
            if (!adapter) return `${index + 1}. Неизвестное устройство`;
            let name = "WebGPU Adapter";
            if (adapter.info) {
                name = adapter.info.description || adapter.info.vendor || name;
            } else if (typeof adapter.requestAdapterInfo === 'function') {
                try {
                    const info = await adapter.requestAdapterInfo();
                    name = info.description || info.vendor || name;
                } catch (e) { name = "Protected GPU Name"; }
            }
            return `${index + 1}. ${name}`;
        }

        async function findAdapters() {
            const select = document.getElementById('gpuSelect');
            if (!navigator.gpu) {
                select.innerHTML = '<option value="-1">WebGPU не поддерживается</option>';
                return;
            }
            try {
                availableAdapters = [];
                if (navigator.gpu.enumerateAdapters) {
                    availableAdapters = await navigator.gpu.enumerateAdapters();
                }
                if (availableAdapters.length === 0) {
                    const high = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
                    const low = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' });
                    if (high) availableAdapters.push(high);
                    if (low && low !== high) availableAdapters.push(low);
                }
                if (availableAdapters.length === 0) {
                    select.innerHTML = '<option value="-1">Карты не найдены</option>';
                    return;
                }
                select.innerHTML = '';
                for (let i = 0; i < availableAdapters.length; i++) {
                    const displayName = await getSafeAdapterName(availableAdapters[i], i);
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.text = displayName;
                    select.appendChild(opt);
                }
            } catch (e) { select.innerHTML = '<option value="-1">Ошибка поиска</option>'; }
        }

        async function initWebGPU(idx) {
            if (device) device.destroy();
            const adapter = availableAdapters[idx];
            device = await adapter.requestDevice();
            document.getElementById('activeGpu').innerText = `Активен: ${await getSafeAdapterName(adapter, idx)}`;

            pipeline = device.createComputePipeline({
                layout: 'auto', compute: { module: device.createShaderModule({ code: shaderCode }), entryPoint: 'main' }
            });

            posBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
            velBuf = device.createBuffer({ size: pointsPerStep * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
            paramBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
            debugBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
            anglesBufGPU = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });

            const initialPos = new Float32Array(count * 4);
            const initialAngles = new Float32Array(count * 4);
            for (let i = 0; i < pointsPerStep; i++) {
                const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, baseRadius);
                initialPos[i * 4] = p.x; initialPos[i * 4 + 1] = p.y; initialPos[i * 4 + 2] = p.z; initialPos[i * 4 + 3] = p.w;
                initialAngles[i * 4] = angles[i].latitude; initialAngles[i * 4 + 1] = angles[i].longitude; initialAngles[i * 4 + 2] = angles[i].altitude;
            }
            device.queue.writeBuffer(posBuf, 0, initialPos);
            device.queue.writeBuffer(anglesBufGPU, 0, initialAngles);

            bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0), entries: [
                    { binding: 0, resource: { buffer: posBuf } }, { binding: 1, resource: { buffer: velBuf } },
                    { binding: 2, resource: { buffer: paramBuf } }, { binding: 3, resource: { buffer: debugBuf } },
                    { binding: 4, resource: { buffer: anglesBufGPU } }
                ]
            });
        }

        async function finalSyncGPU() {
            const readBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.COPY_DST | GPUMapMode.READ | GPUBufferUsage.MAP_READ });
            const enc = device.createCommandEncoder();
            enc.copyBufferToBuffer(anglesBufGPU, 0, readBuf, 0, count * 16);
            device.queue.submit([enc.finish()]);
            await readBuf.mapAsync(GPUMapMode.READ);
            const data = new Float32Array(readBuf.getMappedRange());
            const color = new THREE.Color();
            for (let i = 0; i < count; i++) {
                if (i >= pointsPerStep) {
                    angles[i].latitude = data[i * 4]; angles[i].longitude = data[i * 4 + 1]; angles[i].altitude = data[i * 4 + 2];
                    const s = Math.floor(i / pointsPerStep);
                    const r = baseRadius + s * radiusStep;
                    const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, r);
                    posAttr.setXYZ(i, p.x, p.y, p.z);
                    const t = (p.w + radiusMax) / (2 * radiusMax);
                    color.setHSL(0.7 * (1 - t), 1, 0.5);
                    colorAttr.setXYZ(i, color.r, color.g, color.b);
                }
            }
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
            readBuf.unmap(); readBuf.destroy();
        }

        // --- ЛОГИКА CPU (СИНХРОНИЗИРОВАННАЯ С GPU j = 0) ---
        async function performStepCPU() {
            if (currentStep >= totalSteps) return;
            const prevStart = (currentStep - 1) * pointsPerStep;
            const currStart = currentStep * pointsPerStep;
            const newRadius = radiusPrev + radiusStep;
            const color = new THREE.Color();

            for (let i = 0; i < pointsPerStep; i++) {
                const p1 = polarToCartesian(angles[prevStart + i].latitude, angles[prevStart + i].longitude, angles[prevStart + i].altitude, 1);

                let fx = 0, fy = 0, fz = 0, fw = 0;
                for (let j = 0; j < pointsPerStep; j++) {
                    if (i === j) continue;
                    const p2 = polarToCartesian(angles[prevStart + j].latitude, angles[prevStart + j].longitude, angles[prevStart + j].altitude, 1);
                    const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z, dw = p1.w - p2.w;
                    const d2 = dx * dx + dy * dy + dz * dz + dw * dw;// + 1e-6;
                    const dist = Math.sqrt(d2);
                    const m = REPULSION_STRENGTH / d2;

                    fx += (dx / dist) * m;
                    fy += (dy / dist) * m;
                    fz += (dz / dist) * m;
                    fw += (dw / dist) * m;
                }

                velocities[i].x = velocities[i].x * DAMPING + fx;
                velocities[i].y = velocities[i].y * DAMPING + fy;
                velocities[i].z = velocities[i].z * DAMPING + fz;
                velocities[i].w = velocities[i].w * DAMPING + fw;

                angles[currStart + i] = cartesianToPolar({
                    x: p1.x + velocities[i].x, y: p1.y + velocities[i].y, z: p1.z + velocities[i].z, w: p1.w + velocities[i].w
                });
                const p = polarToCartesian(angles[currStart + i].latitude, angles[currStart + i].longitude, angles[currStart + i].altitude, newRadius);
                posAttr.setXYZ(currStart + i, p.x, p.y, p.z);
                const t = (p.w + radiusMax) / (2 * radiusMax);
                color.setHSL(0.7 * (1 - t), 1, 0.5);
                colorAttr.setXYZ(currStart + i, color.r, color.g, color.b);
            }

            radiusPrev = newRadius; currentStep++;
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
            updateDisplay();
        }

        function initPoints() {
            const color = new THREE.Color();
            if (!RANDOM_POINTS) {
                angles[0] = { altitude: Math.PI / 2, latitude: Math.PI / 19, longitude: 0 };
                angles[1] = { altitude: Math.PI / 2, latitude: Math.PI / 20, longitude: 0 };
                angles[2] = { altitude: Math.PI / 3, latitude: Math.PI / 21, longitude: Math.PI / 2 };
                angles[3] = { altitude: Math.PI / 4, latitude: Math.PI / 22, longitude: -Math.PI / 2 };
                angles[4] = { altitude: Math.PI / 5, latitude: Math.PI / 23, longitude: Math.PI };
            }
            for (let i = 0; i < pointsPerStep; i++) {
                if (RANDOM_POINTS || i >= 5) {
                    const u = Array.from({ length: 4 }, () => Math.random() * 2 - 1);
                    const norm = Math.sqrt(u.reduce((a, b) => a + b * b, 0)) || 1;
                    angles[i] = cartesianToPolar({ x: u[0] / norm, y: u[1] / norm, z: u[2] / norm, w: u[3] / norm });
                }
                const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, baseRadius);
                posAttr.setXYZ(i, p.x, p.y, p.z);
                const t = (p.w + radiusMax) / (2 * radiusMax);
                color.setHSL(0.7 * (1 - t), 1, 0.5);
                colorAttr.setXYZ(i, color.r, color.g, color.b);
            }
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
        }

        function updateDisplay() {
            document.getElementById('stepCounter').innerText = currentStep;
            document.getElementById('radVal').innerText = radiusPrev.toFixed(2);
        }

        const runAuto = async (mode) => {
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            const start = performance.now();
            if (mode === 'GPU') {
                const idx = parseInt(document.getElementById('gpuSelect').value);
                if (idx === -1) { alert("Выберите карту"); document.querySelectorAll('button').forEach(b => b.disabled = false); return; }

                const adapter = availableAdapters[idx];
                const requiredBytes = count * 16;
                const maxAllowedBytes = adapter.limits.maxStorageBufferBindingSize;

                if (requiredBytes > maxAllowedBytes) {
                    alert(`ОШИБКА: Превышен лимит памяти GPU!\n\nТекущее кол-во точек: ${count.toLocaleString()}\nДопустимое кол-во точек: ${Math.floor(maxAllowedBytes / 16).toLocaleString()}\n\nИтерация остановлена.`);
                    document.querySelectorAll('button').forEach(b => b.disabled = false); return;
                }

                await initWebGPU(idx);
                while (currentStep < totalSteps) {
                    const newRadius = radiusPrev + radiusStep;
                    device.queue.writeBuffer(paramBuf, 0, new Float32Array([DAMPING, REPULSION_STRENGTH, newRadius, currentStep * pointsPerStep, pointsPerStep]));
                    const encoder = device.createCommandEncoder();
                    const pass = encoder.beginComputePass();
                    pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup);
                    pass.dispatchWorkgroups(Math.ceil(pointsPerStep / 64));
                    pass.end();
                    device.queue.submit([encoder.finish()]);
                    radiusPrev = newRadius; currentStep++;
                }
                await finalSyncGPU(); updateDisplay();
            } else {
                while (currentStep < totalSteps) { await performStepCPU(); await new Promise(r => requestAnimationFrame(r)); }
            }
            const end = performance.now();
            document.getElementById('timeResult').innerText = `Итог (${mode}): ${((end - start) / 1000).toFixed(3)} сек.`;
            document.querySelectorAll('button').forEach(b => b.disabled = false);
        };

        document.getElementById('stepBtn').onclick = () => performStepCPU();
        document.getElementById('startBtn').onclick = () => runAuto('CPU');
        document.getElementById('gpuBtn').onclick = () => runAuto('GPU');
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        findAdapters(); initPoints(); animate();
    </script>
</body>
</html>
