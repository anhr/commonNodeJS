<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>averageUniverse - Full Debug 4D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
        }

            button:hover {
                background: #333;
            }

            button:disabled {
                opacity: 0.5;
                cursor: wait;
            }

        #info {
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            min-width: 200px;
        }

        .timer {
            color: #00ffcc;
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }

        #gpuNameDisplay {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
            display: block;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="controls">
            <button id="stepBtn">Шаг (CPU)</button>
            <button id="startBtn">Старт (CPU)</button>
            <button id="gpuBtn">Старт (GPU)</button>
        </div>
        <div id="info">
            Шаг: <span id="stepCounter">1</span> / <span id="totalSteps">100</span> | R: <span id="radVal">0.10</span>
            <span id="timeResult" class="timer"></span>
            <span id="gpuNameDisplay"></span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- КОНФИГУРАЦИЯ ---
        const DEBUG_MODE = false;
        const RANDOM_POINTS = DEBUG_MODE ? false : true;//Случайные точки во время инициализации
        const totalSteps = RANDOM_POINTS ? 100 : 10;
        const pointsPerStep = RANDOM_POINTS ? 500 : 5;
        const count = totalSteps * pointsPerStep;
        const baseRadius = 0.1;
        const radiusMax = 2;
        const radiusStep = (radiusMax - baseRadius) / (totalSteps - 1);
        const DAMPING = 0.95;
        const REPULSION = 50 / pointsPerStep;

        document.getElementById('totalSteps').innerText = totalSteps;

        let currentStep = 1;
        let radiusPrev = baseRadius;
        let velocities = Array.from({ length: pointsPerStep }, () => ({ x: 0, y: 0, z: 0, w: 0 }));
        const angles = new Array(count).fill(null).map(() => ({ latitude: 0, longitude: 0, altitude: 0 }));

        // --- THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(3, 3, 3);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const posAttr = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
        const colorAttr = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
        geometry.setAttribute('position', posAttr);
        geometry.setAttribute('color', colorAttr);
        scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.015, vertexColors: true })));

        // --- WebGPU SHADER ---
        const shaderCode = `
            struct Params { damping: f32, repulsion: f32, radius: f32, stepOffset: f32, pointsPerStep: f32 };
            @group(0) @binding(0) var<storage, read_write> positions: array<vec4<f32>>;
            @group(0) @binding(1) var<storage, read_write> velocities: array<vec4<f32>>;
            @group(0) @binding(2) var<uniform> p: Params;
            @group(0) @binding(3) var<storage, read_write> debugForce: vec4<f32>;

            @compute @workgroup_size(64)
            fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                let i = id.x;
                let n = u32(p.pointsPerStep);
                if (i >= n) { return; }

                let prevOffset = u32(p.stepOffset - p.pointsPerStep);
                let currOffset = u32(p.stepOffset);

                let p1 = positions[prevOffset + i];
                let p1_n = normalize(p1);

                var force = vec4<f32>(0.0);
                for (var j = 0u; j < n; j++) {
                    if (i == j) { continue; }
                    let p2_n = normalize(positions[prevOffset + j]);
                    let diff = p1_n - p2_n;
                    let d2 = dot(diff, diff) + 1e-6;
                    force += normalize(diff) * (p.repulsion / d2);
                }

                if (i == 0u) { debugForce = force; }

                let v = velocities[i] * p.damping + force;
                velocities[i] = v;
                positions[currOffset + i] = normalize(p1_n + v) * p.radius;
            }
        `;

        // --- МАТЕМАТИКА CPU ---
        const polarToCartesian = (la, lo, al, r) => {
            const r_xyz = r * Math.sin(al), w = r * Math.cos(al);
            return { x: r_xyz * Math.cos(la) * Math.cos(lo), y: r_xyz * Math.cos(la) * Math.sin(lo), z: r_xyz * Math.sin(la), w };
        };
        const cartesianToPolar = (v) => {
            const R = Math.sqrt(v.x ** 2 + v.y ** 2 + v.z ** 2 + v.w ** 2) || 1e-10, al = Math.acos(Math.min(1, Math.max(-1, v.w / R)));
            const rXYZ = Math.sqrt(v.x ** 2 + v.y ** 2 + v.z ** 2) || 1e-10;
            return { altitude: al, latitude: Math.asin(Math.min(1, Math.max(-1, v.z / rXYZ))), longitude: Math.atan2(v.y, v.x) };
        };

        function initPoints() {
            const color = new THREE.Color();
            if (!RANDOM_POINTS) {
                angles[0] = {altitude: Math.PI / 2, latitude: Math.PI / 19, longitude: 0};
                angles[1] = {altitude: Math.PI / 2, latitude: Math.PI / 20, longitude: 0};
                angles[2] = {altitude: Math.PI / 3, latitude: Math.PI / 21, longitude: Math.PI / 2};
                angles[3] = {altitude: Math.PI / 4, latitude: Math.PI / 22, longitude: -Math.PI / 2};
                angles[4] = {altitude: Math.PI / 5, latitude: Math.PI / 23, longitude: Math.PI};
            }
            for (let i = 0; i < pointsPerStep; i++) {
                if (RANDOM_POINTS){
                    const u = Array.from({ length: 4 }, () => Math.random() * 2 - 1);
                    const norm = Math.sqrt(u.reduce((a, b) => a + b * b, 0)) || 1;
                    angles[i] = cartesianToPolar({ x: u[0] / norm, y: u[1] / norm, z: u[2] / norm, w: u[3] / norm });
                }
                const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, baseRadius);
                posAttr.setXYZ(i, p.x, p.y, p.z);
                color.setHSL(0.7 * (1 - (p.w + radiusMax) / (2 * radiusMax)), 1, 0.5);
                colorAttr.setXYZ(i, color.r, color.g, color.b);
            }
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
        }

        async function performStepCPU() {
            if (currentStep >= totalSteps) return;
            const prevStart = (currentStep - 1) * pointsPerStep;
            const currStart = currentStep * pointsPerStep;
            const newRadius = radiusPrev + radiusStep;
            const color = new THREE.Color();
            const currentPoints = [];

            for (let i = 0; i < pointsPerStep; i++)
                currentPoints.push(polarToCartesian(angles[prevStart + i].latitude, angles[prevStart + i].longitude, angles[prevStart + i].altitude, 1));

            for (let i = 0; i < pointsPerStep; i++) {
                let f = { x: 0, y: 0, z: 0, w: 0 };
                for (let j = 0; j < pointsPerStep; j++) {
                    if (i === j) continue;
                    const dx = currentPoints[i].x - currentPoints[j].x, dy = currentPoints[i].y - currentPoints[j].y, dz = currentPoints[i].z - currentPoints[j].z, dw = currentPoints[i].w - currentPoints[j].w;
                    const d2 = dx * dx + dy * dy + dz * dz + dw * dw + 1e-6;
                    const m = REPULSION / d2;
                    f.x += dx / Math.sqrt(d2) * m; f.y += dy / Math.sqrt(d2) * m; f.z += dz / Math.sqrt(d2) * m; f.w += dw / Math.sqrt(d2) * m;
                }
                velocities[i].x = velocities[i].x * DAMPING + f.x;
                velocities[i].y = velocities[i].y * DAMPING + f.y;
                velocities[i].z = velocities[i].z * DAMPING + f.z;
                velocities[i].w = velocities[i].w * DAMPING + f.w;

                angles[currStart + i] = cartesianToPolar({ x: currentPoints[i].x + velocities[i].x, y: currentPoints[i].y + velocities[i].y, z: currentPoints[i].z + velocities[i].z, w: currentPoints[i].w + velocities[i].w });
                const p = polarToCartesian(angles[currStart + i].latitude, angles[currStart + i].longitude, angles[currStart + i].altitude, newRadius);
                posAttr.setXYZ(currStart + i, p.x, p.y, p.z);
                color.setHSL(0.7 * (1 - (p.w + radiusMax) / (2 * radiusMax)), 1, 0.5);
                colorAttr.setXYZ(currStart + i, color.r, color.g, color.b);
            }
            radiusPrev = newRadius;
            currentStep++;
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
            updateUIDisplay();
        }

        // --- WebGPU ---
        let device, pipeline, posBuf, velBuf, paramBuf, debugBuf, bindGroup, activeGpuName;

        async function initWebGPU() {
            if (!navigator.gpu) return false;
            let adapter;
            try {
                adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
            } catch (e) {
                adapter = await navigator.gpu.requestAdapter();
            }
            if (!adapter) return false;
            device = await adapter.requestDevice();

            try {
                const info = (adapter.info) ? adapter.info : (await adapter.requestAdapterInfo());
                activeGpuName = info.description || info.vendor || "WebGPU Device";
                if (adapter.isFallbackAdapter) activeGpuName += " (Fallback Mode)";
            } catch (e) { activeGpuName = "High Performance GPU"; }

            pipeline = device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code: shaderCode }), entryPoint: 'main' } });
            posBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
            velBuf = device.createBuffer({ size: pointsPerStep * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
            paramBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
            debugBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

            const initialData = new Float32Array(count * 4);
            for (let i = 0; i < pointsPerStep; i++) {
                const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, baseRadius);
                initialData[i * 4] = p.x; initialData[i * 4 + 1] = p.y; initialData[i * 4 + 2] = p.z; initialData[i * 4 + 3] = p.w;
            }
            device.queue.writeBuffer(posBuf, 0, initialData);

            bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0), entries: [
                    { binding: 0, resource: { buffer: posBuf } }, { binding: 1, resource: { buffer: velBuf } },
                    { binding: 2, resource: { buffer: paramBuf } }, { binding: 3, resource: { buffer: debugBuf } }
                ]
            });
            return true;
        }

        async function readDebugValue(step) {
            const readBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
            const encoder = device.createCommandEncoder();
            encoder.copyBufferToBuffer(debugBuf, 0, readBuf, 0, 16);
            device.queue.submit([encoder.finish()]);
            await readBuf.mapAsync(GPUMapMode.READ);
            const f = new Float32Array(readBuf.getMappedRange());

            // ВЫВОД ВСЕХ 4 КООРДИНАТ
            console.log(`[GPU Step ${step}] Force Point 0: x=${f[0].toFixed(6)}, y=${f[1].toFixed(6)}, z=${f[2].toFixed(6)}, w=${f[3].toFixed(6)}`);

            readBuf.unmap(); readBuf.destroy();
        }

        async function finalSyncGPU() {
            const readBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
            const enc = device.createCommandEncoder();
            enc.copyBufferToBuffer(posBuf, 0, readBuf, 0, count * 16);
            device.queue.submit([enc.finish()]);
            await readBuf.mapAsync(GPUMapMode.READ);
            const data = new Float32Array(readBuf.getMappedRange());
            const color = new THREE.Color();
            for (let i = 0; i < count; i++) {
                const x = data[i * 4], y = data[i * 4 + 1], z = data[i * 4 + 2], w = data[i * 4 + 3];
                if (x !== 0 || y !== 0) {
                    posAttr.setXYZ(i, x, y, z);
                    const t = (w + radiusMax) / (2 * radiusMax);
                    color.setHSL(0.7 * (1 - t), 1, 0.5);
                    colorAttr.setXYZ(i, color.r, color.g, color.b);
                }
            }
            posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
            readBuf.unmap(); readBuf.destroy();
        }

        function updateUIDisplay() {
            document.getElementById('stepCounter').innerText = currentStep;
            document.getElementById('radVal').innerText = radiusPrev.toFixed(2);
        }

        const runAuto = async (mode) => {
            const isGPU = mode === 'GPU';
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            const start = performance.now();

            if (isGPU) {
                if (!device) await initWebGPU();
                document.getElementById('gpuNameDisplay').innerText = activeGpuName;
                while (currentStep < totalSteps) {
                    const currStart = currentStep * pointsPerStep;
                    const newRadius = radiusPrev + radiusStep;
                    device.queue.writeBuffer(paramBuf, 0, new Float32Array([DAMPING, REPULSION, newRadius, currStart, pointsPerStep]));
                    const encoder = device.createCommandEncoder();
                    const pass = encoder.beginComputePass();
                    pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup);
                    pass.dispatchWorkgroups(Math.ceil(pointsPerStep / 64));
                    pass.end();
                    device.queue.submit([encoder.finish()]);
                    if (DEBUG_MODE) await readDebugValue(currentStep);
                    radiusPrev = newRadius; currentStep++;
                }
                await finalSyncGPU();
            } else {
                while (currentStep < totalSteps) {
                    await performStepCPU();
                    await new Promise(r => requestAnimationFrame(r));
                }
            }

            const end = performance.now();
            updateUIDisplay();
            document.getElementById('timeResult').innerText = `Итог (${mode}): ${((end - start) / 1000).toFixed(3)} сек.`;
            document.querySelectorAll('button').forEach(b => b.disabled = false);
        };

        document.getElementById('stepBtn').onclick = () => performStepCPU();
        document.getElementById('startBtn').onclick = () => runAuto('CPU');
        document.getElementById('gpuBtn').onclick = () => runAuto('GPU');

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        initPoints(); animate();
    </script>
</body>
</html>
