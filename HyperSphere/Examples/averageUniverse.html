<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>averageUniverse</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }

            button:hover {
                background: #333;
            }

            button:disabled {
                color: #666;
                cursor: not-allowed;
                opacity: 0.5;
            }

        #info {
            color: #aaa;
            font-size: 12px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="controls">
            <button id="stepBtn">Шаг</button>
            <button id="startBtn">Старт</button>
        </div>
        <div id="info">Инициализация...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- НОВАЯ КОНФИГУРАЦИЯ ---
        const totalSteps = 100;
        const pointsPerStep = 500;
        const count = totalSteps * pointsPerStep; // Вычисляем общее количество

        const baseRadius = 0.1;
        const radiusMax = 2;
        const radiusStep = (radiusMax - baseRadius) / (totalSteps - 1);

        let currentStep = 1;
        let radiusPrev = baseRadius;

        // Массив данных для углов
        const pointsData = new Array(count).fill(null).map(() => ({ lat: 0, lon: 0, alt: 0 }));

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(3, 3, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Подготовка геометрии
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.015,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });

        const pointsMesh = new THREE.Points(geometry, material);
        scene.add(pointsMesh);

        // --- МАТЕМАТИКА ---
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        function polarToCartesian(lat, lon, alt, r) {
            return {
                x: r * Math.sin(alt) * Math.sin(lat) * Math.cos(lon),
                y: r * Math.sin(alt) * Math.sin(lat) * Math.sin(lon),
                z: r * Math.sin(alt) * Math.cos(lat),
                w: r * Math.cos(alt)
            };
        }

        const colorTool = new THREE.Color();

        // --- ФУНКЦИИ УПРАВЛЕНИЯ ---
        function updateInfo() {
            document.getElementById('info').innerText =
                `Шаг: ${currentStep}/${totalSteps} (R=${radiusPrev.toFixed(2)}) | Всего точек: ${count}`;
        }

        function initFirstGroup() {
            const posAttr = geometry.getAttribute('position');
            const colorAttr = geometry.getAttribute('color');

            for (let i = 0; i < count; i++) {
                let p;
                if (i < pointsPerStep) {
                    // Генерация случайных углов для первой группы (индексы 0 - 499)
                    const u1 = Math.random(), u2 = Math.random(), u3 = Math.random(), u4 = Math.random();
                    const r0 = Math.sqrt(-2.0 * Math.log(u1 || 0.0001)) * Math.cos(2.0 * Math.PI * u2);
                    const r1 = Math.sqrt(-2.0 * Math.log(u1 || 0.0001)) * Math.sin(2.0 * Math.PI * u2);
                    const r2 = Math.sqrt(-2.0 * Math.log(u3 || 0.0001)) * Math.cos(2.0 * Math.PI * u4);
                    const r3 = Math.sqrt(-2.0 * Math.log(u3 || 0.0001)) * Math.sin(2.0 * Math.PI * u4);
                    const norm = Math.sqrt(r0 ** 2 + r1 ** 2 + r2 ** 2 + r3 ** 2) || 1;

                    const alt = Math.acos(clamp(r3 / norm, -1, 1));
                    const sinAlt = Math.sin(alt);
                    const lat = (Math.abs(sinAlt) > 1e-10) ? Math.acos(clamp(r2 / (norm * sinAlt), -1, 1)) : 0;
                    const lon = Math.atan2(r1, r0);

                    pointsData[i] = { lat, lon, alt };
                    p = polarToCartesian(lat, lon, alt, baseRadius);
                } else {
                    // Все остальные точки инициализируются в центре с углами 0
                    p = { x: 0, y: 0, z: 0, w: 0 };
                }

                posAttr.setXYZ(i, p.x, p.y, p.z);

                // Цветовая разметка (w нормализован относительно radiusMax)
                const t = (p.w + radiusMax) / (2 * radiusMax);
                colorTool.setHSL(0.7 * (1 - t), 1.0, 0.5);
                colorAttr.setXYZ(i, colorTool.r, colorTool.g, colorTool.b);
            }
            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
            updateInfo();
        }

        function performStep() {
            if (currentStep >= totalSteps) return;

            const prevStepStart = (currentStep - 1) * pointsPerStep;
            const currStepStart = currentStep * pointsPerStep;
            const newRadius = radiusPrev + radiusStep;

            const posAttr = geometry.getAttribute('position');
            const colorAttr = geometry.getAttribute('color');

            for (let j = 0; j < pointsPerStep; j++) {
                const prevIdx = prevStepStart + j;
                const currIdx = currStepStart + j;

                // Копируем углы из предыдущей группы в текущую в массив данных
                pointsData[currIdx].lat = pointsData[prevIdx].lat;
                pointsData[currIdx].lon = pointsData[prevIdx].lon;
                pointsData[currIdx].alt = pointsData[prevIdx].alt;

                // Вычисляем координаты для новой группы
                const p = polarToCartesian(
                    pointsData[currIdx].lat,
                    pointsData[currIdx].lon,
                    pointsData[currIdx].alt,
                    newRadius
                );

                posAttr.setXYZ(currIdx, p.x, p.y, p.z);

                const t = (p.w + radiusMax) / (2 * radiusMax);
                colorTool.setHSL(0.7 * (1 - t), 1.0, 0.5);
                colorAttr.setXYZ(currIdx, colorTool.r, colorTool.g, colorTool.b);
            }

            radiusPrev = newRadius;
            currentStep++;
            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
            updateInfo();

            if (currentStep === totalSteps) {
                document.getElementById('stepBtn').disabled = true;
                document.getElementById('startBtn').disabled = true;
            }
        }

        // События
        document.getElementById('stepBtn').addEventListener('click', performStep);
        document.getElementById('startBtn').addEventListener('click', () => {
            while (currentStep < totalSteps) performStep();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        initFirstGroup();
        animate();
    </script>
</body>
</html>
