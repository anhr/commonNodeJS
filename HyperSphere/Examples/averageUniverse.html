<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>averageUniverse</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls { display: flex; gap: 5px; }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #333; }
        button:disabled { color: #666; cursor: not-allowed; opacity: 0.5; }
        #info { color: #aaa; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="controls">
        <button id="stepBtn">Шаг</button>
        <button id="startBtn">Старт</button>
    </div>
    <div id="info">Инициализация...</div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const π = Math.PI;
    
    // Скорости точек (для инерции)
    let velocities = [];

    // --- КОНФИГУРАЦИЯ ---
    const totalSteps = 10;
    const pointsPerStep = 5;
    const count = totalSteps * pointsPerStep;

    const baseRadius = 0.1;
    const radiusMax = 2;
    const radiusStep = (radiusMax - baseRadius) / (totalSteps - 1);

    let currentStep = 1;
    let radiusPrev = baseRadius;

/*	
    // Массив данных для углов с новыми названиями
    const angles = new Array(count).fill(null).map(() => ({ 
        latitude: 0, 
        longitude: 0, 
        altitude: 0 
    }));
*/	

	//Все точки, противоположные точке 0, имеют близкие координаты.
	const angles = [
		{altitude: Math.PI / 2, latitude: Math.PI / 19, longitude: 0},//0
		{altitude: Math.PI / 2, latitude: Math.PI / 20, longitude: 0},//1
		{altitude: Math.PI / 3, latitude: Math.PI / 21, longitude: Math.PI / 2},//2
		{altitude: Math.PI / 4, latitude: Math.PI / 22, longitude: -Math.PI / 2},//3
		{altitude: Math.PI / 5, latitude: Math.PI / 23, longitude: Math.PI},//4
	];
    
	const a = 50;//0.5;
	const REPULSION_STRENGTH = a / angles.length;//0.05; // Сила отталкивания. Чем меньше значение, тем слабее силы отталкивания между точками, и тем медленнее они двигаются
	const DAMPING = 0.95; // Демпфирование движения
    
	// Инициализируем скорости
	if (velocities.length === 0) velocities = new Array(pointsPerStep).fill(null).map(() => ({ x: 0, y: 0, z: 0, w: 0 }));

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(3, 3, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.015,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        sizeAttenuation: true
    });

    const pointsMesh = new THREE.Points(geometry, material);
    scene.add(pointsMesh);

    // --- МАТЕМАТИКА ---
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

/*	
    function polarToCartesian(latitude, longitude, altitude, r) {
        return {
            x: r * Math.sin(altitude) * Math.sin(latitude) * Math.cos(longitude),
            y: r * Math.sin(altitude) * Math.sin(latitude) * Math.sin(longitude),
            z: r * Math.sin(altitude) * Math.cos(latitude),
            w: r * Math.cos(altitude)
        };
    }
*/	
    function polarToCartesian(lat, lon, alt, r) {
/*		
		const lat = angles.latitude;
		const lon = angles.longitude;
		const alt = angles.altitude;
*/		
	
		// Вычисляем компоненту, которая проецируется на 3D-подпространство (x, y, z)
		const r_xyz = r * Math.sin(alt);
	
		// Координата в четвертом измерении
		const w = r * Math.cos(alt);
	
		// Стандартные сферические координаты, но масштабированные r_xyz
		const x = r_xyz * Math.cos(lat) * Math.cos(lon);
		const y = r_xyz * Math.cos(lat) * Math.sin(lon);
		const z = r_xyz * Math.sin(lat);
		
		if(isNaN(x) || isNaN(y) || isNaN(z) || isNaN(w)) console.error('Invalid cartesian: x = ' + x + ', y = ' + y + ', z = ' + z + ', w = ' + w);
	
        return { x: x, y: y, z: z, w: w };
    }
	function cartesianToPolar(vertice) {
	
		const x = vertice.x;
		const y = vertice.y;
		const z = vertice.z;
		const w = vertice.w;
	
		// 1. Полный радиус гиперсферы
		const R = Math.sqrt(x * x + y * y + z * z + w * w);
	
		if (R === 0) {
			console.error('Under constraction');
//			return [0, 0, 0];
			return {altitude: 0, latitude: 0, longitude: 0};
		}
	
		// 2. Вычисление Altitude (относительно оси W)
		// Диапазон [0, PI]
		const altitude = Math.acos(w / R);
	
		// Вычисляем радиус проекции в 3D пространстве (xyz)
		const rXYZ = Math.sqrt(x * x + y * y + z * z);
	
		// Если rXYZ близок к 0, значит точка лежит на оси W, 
		// и широта с долготой не определены (принимаем за 0)
		if (rXYZ < 1e-10) {
			console.error('Under constraction');
//			return [altitude, 0, 0];
			return {altitude: altitude, latitude: 0, longitude: 0};
		}
	
		// 3. Вычисление Latitude (аналогично 3D сфере)
		// Диапазон [-PI/2, PI/2]
		const latitude = Math.asin(z / rXYZ);
	
		// 4. Вычисление Longitude
		// Диапазон (-PI, PI]
		const longitude = Math.atan2(y, x);
		
		if((isNaN(altitude) || isNaN(latitude) || isNaN(longitude))) console.error('Invalid angles: altitude = ' + altitude + ', latitude = ' + latitude + ', longitude = ' + longitude);
		return {altitude: altitude, latitude: latitude, longitude: longitude};
	}

    const colorTool = new THREE.Color();

    // --- ФУНКЦИИ УПРАВЛЕНИЯ ---
    function updateInfo() {
        document.getElementById('info').innerText = 
            `Шаг: ${currentStep}/${totalSteps} (R=${radiusPrev.toFixed(2)})`;
    }

    function initFirstGroup() {
        const posAttr = geometry.getAttribute('position');
        const colorAttr = geometry.getAttribute('color');
			
        for (let i = 0; i < count; i++) {
            let p;
            if (i < pointsPerStep) {
				const verticeAngles = angles[i];
                p = polarToCartesian(verticeAngles.latitude, verticeAngles.longitude, verticeAngles.altitude, baseRadius);
				/*
                const u1 = Math.random(), u2 = Math.random(), u3 = Math.random(), u4 = Math.random();
                const r0 = Math.sqrt(-2.0 * Math.log(u1 || 0.0001)) * Math.cos(2.0 * Math.PI * u2);
                const r1 = Math.sqrt(-2.0 * Math.log(u1 || 0.0001)) * Math.sin(2.0 * Math.PI * u2);
                const r2 = Math.sqrt(-2.0 * Math.log(u3 || 0.0001)) * Math.cos(2.0 * Math.PI * u4);
                const r3 = Math.sqrt(-2.0 * Math.log(u3 || 0.0001)) * Math.sin(2.0 * Math.PI * u4);
                const norm = Math.sqrt(r0**2 + r1**2 + r2**2 + r3**2) || 1;

                const altitude = Math.acos(clamp(r3 / norm, -1, 1));
                const sinAlt = Math.sin(altitude);
                const latitude = (Math.abs(sinAlt) > 1e-10) ? Math.acos(clamp(r2 / (norm * sinAlt), -1, 1)) : 0;
                const longitude = Math.atan2(r1, r0);

                angles[i] = { latitude, longitude, altitude };
                p = polarToCartesian(latitude, longitude, altitude, baseRadius);
				*/
            } else {
                p = { x: 0, y: 0, z: 0, w: 0 };
				angles.push({altitude: 0, latitude: 0, longitude: 0});
            }

            posAttr.setXYZ(i, p.x, p.y, p.z);
            
            const t = (p.w + radiusMax) / (2 * radiusMax);
            colorTool.setHSL(0.7 * (1 - t), 1.0, 0.5);
            colorAttr.setXYZ(i, colorTool.r, colorTool.g, colorTool.b);
        }
        posAttr.needsUpdate = true;
        colorAttr.needsUpdate = true;
        updateInfo();
    }

    function performStep() {
        if (currentStep >= totalSteps) return;
		
		// Вычисляем силы отталкивания для каждой точки
		const forces = new Array(pointsPerStep).fill(null).map(() => ({ x: 0, y: 0, z: 0, w: 0 }));

        const prevStepStart = (currentStep - 1) * pointsPerStep;
        const currStepStart = currentStep * pointsPerStep;
        const newRadius = radiusPrev + radiusStep;

        const posAttr = geometry.getAttribute('position');
        const colorAttr = geometry.getAttribute('color');
		console.log('currentStep = ' + currentStep + ', of ' + totalSteps);
 
        for (let i = 0; i < pointsPerStep; i++) {
            const prevIdx = prevStepStart + i;
            const currIdx = currStepStart + i;
//console.log('currentStep = ' + currentStep + ', i = ' + i);
            // Наследование углов с новыми названиями
            const angles1 = angles[prevIdx];
            const pos1 = polarToCartesian(
                angles1.latitude, 
                angles1.longitude, 
                angles1.altitude, 
                1//radiusPrev
            );
/*            
            angles[currIdx].latitude = angles1.latitude;
            angles[currIdx].longitude = angles1.longitude;
            angles[currIdx].altitude = angles1.altitude;
*/            
/*            
            angles[currIdx].latitude = angles[prevIdx].latitude;
            angles[currIdx].longitude = angles[prevIdx].longitude;
            angles[currIdx].altitude = angles[prevIdx].altitude;
*/           
            //Мы будем решать проблему Томсона (распределение зарядов на сфере для минимизации энергии), но применительно к 4D-пространству (поверхности гиперсферы).
            //На каждом шаге итерации все точки постепенно движутся в положение, при котором точки окажутся на максимальном удалении друг от друга.
			let pos2, angles2;
			for (
				let j = i + 1;
//				let j = 0;
				j < pointsPerStep;
				j++
			) {
//				if(i === j) continue;
				if (!pos2) {
                    angles2 = angles[j];
                    pos2 = polarToCartesian(
                        angles2.latitude, 
                        angles2.longitude, 
                        angles2.altitude, 
                        1//radiusPrev
                    );
				}
                
				// Вектор от i к j
				let dx = pos1.x - pos2.x;
				let dy = pos1.y - pos2.y;
				let dz = pos1.z - pos2.z;
				let dw = pos1.w - pos2.w;

				let dist = Math.sqrt(dx * dx + dy * dy + dz * dz + dw * dw);
                
//				const arc = π - hyperbola((dist / classSettings.overriddenProperties.r(settings.bufferGeometry.userData.timeId - 1) / 2) * π);
				const arc = dist=== 0 ? Math.PI: 0;//шум равен нулю
                
				// Случайное направление для точки i
//				const noise1 = utils.anglesToCartesian(RandomVertice.get(arc, utils.angles([angles1[0], angles1[1], angles1[2]]), classSettings, RandomVertice), r);
				const noise1 = pos1;
					
				// Случайное направление для точки j (может быть противоположным для лучшего разведения)
//				const noise2 = utils.anglesToCartesian(RandomVertice.get(arc, utils.angles([angles2[0], angles2[1], angles2[2]]), classSettings, RandomVertice), r);
				const noise2 = pos2;
                
				// Применяем шум к позициям через скорости
				const antiDist = arc / π;
				if(antiDist < 0) console.error(sAverageVertices + ': iterationStep. Invalid antiDist = ' + antiDist);
				velocities[i].x += noise1.x * antiDist;
				velocities[i].y += noise1.y * antiDist;
				velocities[i].z += noise1.z * antiDist;
				velocities[i].w += noise1.w * antiDist;
				
				velocities[j].x += noise2.x * antiDist;
				velocities[j].y += noise2.y * antiDist;
				velocities[j].z += noise2.z * antiDist;
				velocities[j].w += noise2.w * antiDist;

				// Вектор от i к j
				dx = noise1.x - noise2.x;
				dy = noise1.y - noise2.y;
				dz = noise1.z - noise2.z;
				dw = noise1.w - noise2.w;

				dist = Math.sqrt(dx * dx + dy * dy + dz * dz + dw * dw);
//				boRandomVertice = true;
				pos2 = undefined;
				if (dist === 0) continue;
				
				// Сила обратно пропорциональна расстоянию
				const forceMagnitude = REPULSION_STRENGTH / (dist * dist);

				// Нормализуем вектор
				dx /= dist;
				dy /= dist;
				dz /= dist;
				dw /= dist;

				const forcei = forces[i], forcesj = forces[j];

				// Применяем силу: отталкивание
				forcei.x += dx * forceMagnitude;
				forcei.y += dy * forceMagnitude;
				forcei.z += dz * forceMagnitude;
				forcei.w += dw * forceMagnitude;

				forcesj.x -= dx * forceMagnitude;
				forcesj.y -= dy * forceMagnitude;
				forcesj.z -= dz * forceMagnitude;
				forcesj.w -= dw * forceMagnitude;

            }

        }

		// Применяем силы к точкам
		for (let i = 0; i < pointsPerStep; i++) {

			const prevIdx = prevStepStart + i;
			const currIdx = currStepStart + i;
			const verticeAngles = angles[prevIdx];
			const pos = polarToCartesian(
				verticeAngles.latitude, 
				verticeAngles.longitude, 
				verticeAngles.altitude, 
				1//radiusPrev
			);
			const velocitie = velocities[i],
				force = forces[i];

			// Обновляем скорость с учетом силы и демпфирования
			velocitie.x = velocitie.x * DAMPING + force.x;
			velocitie.y = velocitie.y * DAMPING + force.y;
			velocitie.z = velocitie.z * DAMPING + force.z;
			velocitie.w = velocitie.w * DAMPING + force.w;

			const anglesCurr = cartesianToPolar({ x: pos.x + velocitie.x, y: pos.y + velocitie.y, z: pos.z + velocitie.z, w: pos.w + velocitie.w });
			const p = polarToCartesian(
				anglesCurr.latitude, 
				anglesCurr.longitude, 
				anglesCurr.altitude, 
				newRadius
			);
			
			posAttr.setXYZ(currIdx, p.x, p.y, p.z);

			const t = (p.w + radiusMax) / (2 * radiusMax);
			colorTool.setHSL(0.7 * (1 - t), 1.0, 0.5);
			colorAttr.setXYZ(currIdx, colorTool.r, colorTool.g, colorTool.b);

/*				
			const vertice = utils.cartesianToAngles({ x: pos.x + velocitie.x, y: pos.y + velocitie.y, z: pos.z + velocitie.z, w: pos.w + velocitie.w }, classSettings.debug);
			settings.overriddenProperties.editVertice(data.timeId, vertice, angles, i);
*/				

		}

        radiusPrev = newRadius;
        currentStep++;
        posAttr.needsUpdate = true;
        colorAttr.needsUpdate = true;
        updateInfo();

        if (currentStep === totalSteps) {
            document.getElementById('stepBtn').disabled = true;
            document.getElementById('startBtn').disabled = true;
        }
    }

    document.getElementById('stepBtn').addEventListener('click', performStep);
    document.getElementById('startBtn').addEventListener('click', () => {
        while (currentStep < totalSteps) performStep();
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    initFirstGroup();
    animate();
</script>
</body>
</html>
