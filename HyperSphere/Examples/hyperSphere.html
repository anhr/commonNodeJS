	<script type="module">

		import * as THREE from '../../../../three.js/dev/build/three.module.js';
		//import * as THREE from 'https://threejs.org/build/three.module.js';
		//import * as THREE from 'https://raw.githack.com/anhr/three.js/dev/build/three.module.js';

		import MyThree from '../../myThree/myThree.js';
		//import MyThree from '../../myThree/build/myThree.module.js';
		//import MyThree from '../../myThree/build/myThree.module.min.js';
		//import MyThree from 'https://raw.githack.com/anhr/commonNodeJS/master/myThree/myThree.js';
		//import MyThree from 'https://raw.githack.com/anhr/commonNodeJS/master/myThree/build/myThree.module.js';
		//import MyThree from 'https://raw.githack.com/anhr/commonNodeJS/master/myThree/build/myThree.module.min.js';
		MyThree.three.THREE = THREE;

		import HyperSphere3D from '../hyperSphere3D.js';
		
		//select one:
		import distanceOfVertices from '../distanceOfVertices/averageVerticesHSphere.js';
		//or
		//import distanceOfVertices from '../distanceOfVertices/middleVerticesHSphere.js';

		new MyThree( (scene, options) => {

			/*
			//divide hypersphere to segments
			const anglesCount = 1000, angle = Math.PI * 2 / anglesCount, angles = [];
			for (let angleId = 0; angleId < anglesCount; angleId++) angles.push([angle * angleId, angle * angleId * angleId, angle * angleId * angleId * angleId]);
			*/
			
			new HyperSphere3D(options,
			{

				compute: {
					config: {
	//					type: 'START_COMPUTE',//Default 'START_COMPUTE'
	
						//Select one:
						
						RANDOM_POINTS: 0,//Случайная точка не вычисляется. Вместо этого возвращается PSEUDO_RANDOM.
						
				        //Вычисляется случайное число.
				        //В GPU для получения случайного числа применяется хеширование(Hashing).Простой генератор псевдослучайных чисел(PCG).Permuted Congruential Generator(Перемешанный конгруэнтный генератор).
				        //Этот метод лучше всего вычисляет случайное число, но требует много времени на вычисления если не оптимизировать Google Chrome.
				        //Инструкция по оптимизации находится в Technical Guide: Enabling High-Performance GPU for Google Chrome https://github.com/anhr/universe/blob/main/hyperSphere/HUniverseEngine.md#technical-guide-enabling-high-performance-gpu-for-google-chrome Инструкцию по оттимизации смотри в D:\My documents\MyProjects\webgl\three.js\GitHub\universe\main\hyperSphere\webGPUHUniverse.js
						//Значение по умолчанию
				        //RANDOM_POINTS: 1,
						
						PSEUDO_RANDOM: 1,//Have effect only if RANDOM_POINTS: 0. Available range from 0 to 1. Default 0.5
	
						//Damping is a velocity reduction factor applied at each iteration step.
						//It simulates friction or energy dissipation in the system.
						//Without damping, particles would oscillate indefinitely around equilibrium positions, never stabilizing.
						//Valid DAMPING value range:
						//  0 - Heavy damping, quick stopping. Fast stabilization, no oscillations
						//  1 - No damping. Not recommended for production
						//Default 0.95.
						//See https://chat.deepseek.com/share/azo3y7zgc6hov7mlfp for details.
						//DAMPING: 0.95,
	
						//Сила отталкивания. Чем меньше значение, тем слабее силы отталкивания между точками, и тем медленнее они двигаются
						REPULSION_STRENGTH: 0.03,//По умолчанию не определено и зависит от количества вершин REPULSION_STRENGTH = config.a / classSettings.settings.object.geometry.angles.length.
						//a: 50,//имеет эффект только если не определен REPULSION_STRENGTH. Default 50
						
	
						//Hyperbola parametr. See RandomVertice.calculateHyperbola
						//p: 0 Прямая линия: y = x (через точки (0,0) и (π,π)).
						//p: 1 Два отрезка: вертикальный и горизонтальный
						//0 < p < 1 Гипербола. График гиперболы млжно посмотреть на http://localhost/anhr/commonNodeJS/master/HyperSphere/Examples/hyperbola.html
						p: 0.99,//Default 0
	
						//LOG: true,//log to console all calculated vertices. Default undefined. Внимание!!! отнимает много времени во время итерации
					},
				},
				distanceOfVertices: distanceOfVertices,
				/*
				intersection: {
					
					position: 1,
					//color: 'red',
					
				},
				*/
				onSelectScene: (hyperSphere, timeId, t) => { if (hyperSphere.distanceOfVertices) return hyperSphere.distanceOfVertices(timeId, t); },
				edges: {

					project: false,//Doesn't project edges onto canvas
					//creationMethod: HyperSphere3D.edgesCreationMethod.Random,
					
				},
				edges: false,
				randomArc: true,
				//randomMiddleVertice: false,
				projectParams:{
					
					scene: scene,
					/*
					params: {
						
						//center: {x: 0.5, y: 0.3},
					
					}
					 */
					
				},
				r: 0.1,
				//r: 0.1 + (2-0.1)/(10-1),//for debug of http://localhost/anhr/commonNodeJS/master/HyperSphere/Examples/averageUniverseGPU.html
				debug: {

					probabilityDensity: false,
					//middleVertice: false,
					log: false,
					
				},
				//debug: false,
				settings: {
					
					object: {
	
						//name: 'edges',
						//color: 'red',
						//color: 0xffffff,
						geometry: {

							//Tesseract https://en.wikipedia.org/wiki/Tesseract
							//Please set indices.edges for tesseract
							angles: [
								//cube 1
								[Math.PI / 2, Math.PI * 1 / 4,   Math.PI * 1 / 4],
								[Math.PI / 2, Math.PI * 1 / 4,   Math.PI * 3 / 4],
								[Math.PI / 2, Math.PI * 1 / 4, - Math.PI * 3 / 4],
								[Math.PI / 2, Math.PI * 1 / 4, - Math.PI * 1 / 4],
								[Math.PI / 2, - Math.PI * 1 / 4, - Math.PI * 1 / 4],
								[Math.PI / 2, - Math.PI * 1 / 4,   Math.PI * 1 / 4],
								[Math.PI / 2, - Math.PI * 1 / 4,   Math.PI * 3 / 4],
								[Math.PI / 2, - Math.PI * 1 / 4, - Math.PI * 3 / 4],
								//cube 2
								[Math.PI / 4, Math.PI * 1 / 4,   Math.PI * 1 / 4],
								[Math.PI / 4, Math.PI * 1 / 4,   Math.PI * 3 / 4],
								[Math.PI / 4, Math.PI * 1 / 4, - Math.PI * 3 / 4],
								[Math.PI / 4, Math.PI * 1 / 4, - Math.PI * 1 / 4],
								[Math.PI / 4, - Math.PI * 1 / 4, - Math.PI * 1 / 4],
								[Math.PI / 4, - Math.PI * 1 / 4,   Math.PI * 1 / 4],
								[Math.PI / 4, - Math.PI * 1 / 4,   Math.PI * 3 / 4],
								[Math.PI / 4, - Math.PI * 1 / 4, - Math.PI * 3 / 4],
							],
							
							//test for angles range
							angles: [
								//vertice 0
								[
									0,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
								//vertice 1
								[
									//Math.PI / 2,//Altitude
									-1 * Math.PI / 4,//Altitude
									
									Math.PI / 4,//Latitude
									//Math.PI * 3 / 4,//Latitude invalid range from -π/2 to π/2
									//Math.PI * (1 / 4 + 2),//Latitude invalid range from -π/2 to π/2
									
									0,//Longitude
									//Math.PI * 2,//Longitude invalid range from -π to π
								],
								//vertice 2
								[
									2 * Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
								//vertice 3
								[
									3 * Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
								//vertice 4
								[
									4 * Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
								//vertice 5
								[
									5 * Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
								//vertice 6
								[
									9 * Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],
							],
							//Antipodal angles
							angles: [
								[
									Math.PI / 2 + Math.PI / 4,//Altitude
									Math.PI / 4,//Latitude
									0,//Longitude
								],//0
								[
									Math.PI / 2 - Math.PI / 4,//Altitude
									-Math.PI / 4,//Latitude
									Math.PI,//Longitude
								],//1
							],
							angles: [
								[
									//0.5235987755982988,//Altitude
									-0.7,//Altitude. Out of the range
									//0.7853981633974483,//Latitude
									10,//Latitude. Out of the range
									1.0471975511965976,//Longitude
								],//0
								[
									2.6179938779914944,//Altitude
									-0.7853981633974483,//Latitude
									-2.0943951023931957,//Longitude
								],//1
							],
							//для проверки облака случайных точек
							//Для проверки выбрать точку 2
							//Перейти "Meshes\Points\Point Local Position\Advansed\Edges" = (2) 2,3
							angles: [
								[],//0
								[Math.PI / 2, Math.PI / 2],//1
								[
									Math.PI / 4,//Altitude
									- Math.PI / 6,//Latitude
									Math.PI * 0,//Longitude
								],//2
								
								//[Math.PI / 4, - Math.PI / 6, Math.PI * 2 * 1 / 3],//3
								[Math.PI / 8, - Math.PI / 6, Math.PI * 2 * 1 / 3],//3 маленькая высота
								//[Math.PI / 4 + Math.PI / 2, Math.PI / 6, Math.PI * 0 - Math.PI],//3 Эта точка противоположна точке 2. Все случайные точки должны равномерно распределены по гиперсфере
								//[Math.PI / 4 + Math.PI / 2, -Math.PI / 6, Math.PI * 0],//3 Эта точка совпадает с точкой 2 за исключением высоты. Высота установлена так, ЧТО на холсте точки 2 и 3 совпадают.
								//[Math.PI / 4, - Math.PI / 6, Math.PI * 0],//3 Эта точка совпадает с точкой 2. Все случайные точки должны совпадать с точками 2 и 3
								
								[Math.PI / 2, - Math.PI / 6, - Math.PI * 2 * 1 / 3],//4
							],
							//центроид в начале координат. Положение средней точки не определено, то есть случайно может находиться в двух местах
							//Невырожденный случай
							//Что то не поучается центроид в начале координат. Это обыкновенная точка.
							angles: [
								[],//0. Position = [0,0,0,0]
								[Math.PI / 2, 0, 0],//1. Position = [1,0,0,0]
								//[Math.PI / 2 + Math.PI / 40, 0, 0],//1.
								[Math.PI / 2, 0, Math.PI / 2],//2. Position = [0, 1, 0, 0]
								[Math.PI / 2, Math.PI / 2, 0],//3. Position = [0, 0, 1, 0]
								[0, Math.PI / 2, 0],//4. Position = [0, 0, 0, 1]
							],
							//pentahedroid https://en.wikipedia.org/wiki/5-cell
							//Все точки, противоположные точке 0, имеют одинаковые координаты. Нужно для определения максимального значения нормали norm при вычислении средней точки. Оно должно быть равно 1
							angles: [
								[],//0. Position = [0,0,0,0]
								[Math.PI / 2, 0, 0],//1. Position = [1,0,0,0]
								[Math.PI / 2, 0, 0],//2. Position = [1,0,0,0]
								[Math.PI / 2, 0, 0],//3. Position = [1,0,0,0]
								[Math.PI / 2, 0, 0],//4. Position = [1,0,0,0]
							],
							//pentahedroid https://en.wikipedia.org/wiki/5-cell
							angles: [
								[],//0
								[Math.PI / 2, Math.PI / 2],//1
								[
									Math.PI / 2,//Altitude
									- Math.PI / 6,//Latitude
									Math.PI * 0,//Longitude
								],//2
								[Math.PI / 2, - Math.PI / 6, Math.PI * 2 * 1 / 3],//3
								[Math.PI / 2, - Math.PI / 6, - Math.PI * 2 * 1 / 3],//4
							],
							//центроид в начале координат. Положение средней точки не определено, то есть случайно может находиться в нескольких местах
							//одновременно Вырожденный случай: точки лежат в подпространстве меньшей размерности
							angles: [
								[],//0. Position = [0,0,0,0]
								[Math.PI / 2, 0, 0],//1. Position = [1,0,0,0]
								//[Math.PI / 2 + Math.PI / 40, 0, 0],//1.
								[Math.PI / 2, 0, Math.PI],//2. Position = [-1,0,0,0]
								[Math.PI / 2, 0, Math.PI / 2],//3. Position = [0, 1, 0, 0]
								[Math.PI / 2, 0, - Math.PI / 2],//4. Position = [0, 1, 0, 0]
							],
							angles: [
								[Math.PI / 2, Math.PI / 19, 0],//0
								[Math.PI / 2, Math.PI / 19, 0],//1
								//[Math.PI / 2, Math.PI / 20, 0],//1
								[Math.PI / 3, Math.PI / 21, Math.PI / 2],//2
								[Math.PI / 4, Math.PI / 22, -Math.PI / 2],//3
								[Math.PI / 5, Math.PI / 23, Math.PI],//4
							],
							angles: [
								//[0, 0, 0],//0
								//[Math.PI / 1, Math.PI / 19, Math.PI / 10],//0. Эта вершина лежит на оси W потомучто Altitude = Math.PI. Это приводит к тому что в функции cartesianToPolar величина rXYZ < 1e-10 и широта с долготой не определены (принимаем за 0)
								[Math.PI / 1.5, Math.PI / 19, Math.PI / 10],//0.
								[Math.PI / 2, Math.PI / 20, Math.PI / 11],//1
								[Math.PI / 3, Math.PI / 21, Math.PI / 2],//2
								[Math.PI / 4, Math.PI / 22, -Math.PI / 2],//3
								[Math.PI / 5, Math.PI / 23, Math.PI],//4
							],
							//angles: new Array(200).fill(null).map(() => ([ Math.PI / 4, 1 , Math.PI / 8]))
							//angles: { count: 100, },
							//angles: angles,
							/*
							colors: [
								1, 0, 0,//red
								0, 1, 0,//green
								0, 0, 1,//blue
								//1, 1, 1,//white
							],
							*/
							//opacity: [1, 0.2],
							/*
							indices: {

								edges: { count: 6, },
								//Tesseract
								edges: [
									//cube 1
									[0,1], [1,2], [2,3], [3,0],
									[4,5], [5,6], [6,7], [7,4],
									[0,5], [1,6], [2,7], [3,4],
									//cube 2
									[ 8,9 ], [ 9,10], [10,11], [11,8 ],
									[12,13], [13,14], [14,15], [15,12],
									[ 8,13], [ 9,14], [10,15], [11,12],
									//cube 1 to //cube 2
									[ 0,8], [ 1,9], [2,10], [3,11],
									[ 4,12], [ 5,13], [6,14], [7,15],
								],
								
							}
							*/
						
						}

					}
				
				},
				
				
			});

		}, {

			dat: { guiSelectPoint: { point: (options, dat, fMesh) => { return new HyperSphere3D.ND.gui(options, dat, fMesh); }, }, },
			//camera: { position: new THREE.Vector3( 0, 0, 2 ) },
			scene: { rotation: new THREE.Euler(-Math.PI / 2), },
			scales: {

				//posAxesIntersection: new THREE.Vector3( -1, -1, -1 ),
				text: { precision: 1, rect: { displayRect: false, }, },
				/*see hyperSphere3D.setW
				w: {
					
					min: 0,
					max: 1,
					//name: 't',
				},
				*/

			},
			//dat: false,
			canvas: {

				noButtonFullScreen: true,

			},
			pointLight: false,
			//point: { size: 0.0 },
			//palette: MyThree.ColorPicker.paletteIndexes.BGYW,
			//palette: MyThree.ColorPicker.paletteIndexes.rainbow,
			/*
			playerOptions: {
				
				max: Infinity,
				interval: 100,
				
			},
			*/
			playerOptions: {
				
				//marks: 2,
				//min: 1,
				//max: 1.5,
				max: Infinity,
				interval: 100,
			
			}

		});

	</script>
